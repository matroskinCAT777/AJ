      gap: 10px;
      margin-top: 20px;
    }
    .nav-arrow-btn {
      flex: 1;
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;

      border-radius: 8px;
      font-size: 15px;

  </style>
</head>

const STORAGE_KEY = "category3_macro_v2";

function shuffleArray(arr) {
  const newArr = [...arr];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

let state = [];
let currentIndex = 0;

function loadInitialState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      state = JSON.parse(saved);
      if (state.length === rawQuestions.length) return;
    } catch (e) {
      console.error(e);
    }
  }

  state = rawQuestions.map((item, idx) => ({
    id: idx,
    q: item.q,
    trans: item.trans,
    clue: item.clue,
    expl: item.expl,
    options: shuffleArray(item.options),
    correctStr: item.correct,
    answered: false,
    selectedStr: null,
    isCorrect: false,
    hintShown: false
  }));
  saveState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function initNavGrid() {
  const container = document.getElementById("nav-grid");
  container.innerHTML = "";
  state.forEach((_, idx) => {
    const btn = document.createElement("button");
    btn.className = "nav-btn";
    btn.id = `nav-btn-${idx}`;
    btn.innerText = idx + 1;
    btn.onclick = () => jumpToQuestion(idx);
    container.appendChild(btn);
  });
}

function updateNavGridAndStats() {
  let correctCount = 0;
  let wrongCount = 0;

  state.forEach((s, idx) => {
    const btn = document.getElementById(`nav-btn-${idx}`);
    if (!btn) return;
    btn.className = "nav-btn";
    if (idx === currentIndex) btn.classList.add("active");
    if (s.answered) {
      if (s.isCorrect) {
        btn.classList.add("correct");
        correctCount++;
      } else {
        btn.classList.add("wrong");
        wrongCount++;
      }
    }
  });

  const leftCount = state.length - (correctCount + wrongCount);
  document.getElementById("stat-correct").innerText = correctCount;
  document.getElementById("stat-wrong").innerText = wrongCount;
  document.getElementById("stat-left").innerText = leftCount;
  document.getElementById("score-counter").innerText = `Правильно: ${correctCount}`;
}

function loadQuestion(idx) {
  currentIndex = idx;
  const item = state[currentIndex];

  document.getElementById("q-counter").innerText = `Питання ${currentIndex + 1} / ${state.length}`;
  document.getElementById("progress").style.width = `${((currentIndex + 1) / state.length) * 100}%`;

  const qBox = document.getElementById("q-box");
  qBox.innerHTML = item.q;
  if (item.answered || item.hintShown) {
    qBox.classList.add("show-markers");
  } else {
    qBox.classList.remove("show-markers");
  }

  const container = document.getElementById("opt-container");
  container.innerHTML = "";

  item.options.forEach((optStr) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerText = optStr;

    if (item.answered) {
      btn.disabled = true;
      if (optStr === item.correctStr) btn.classList.add("correct");
      if (optStr === item.selectedStr && !item.isCorrect) btn.classList.add("wrong");
    } else {
      btn.onclick = () => selectAnswer(optStr);
    }
    container.appendChild(btn);
  });

  const reviewBox = document.getElementById("review-box");
  if (item.answered) {
    document.getElementById("trans-text").innerText = item.trans;
    document.getElementById("clue-text").innerText = item.clue;
    document.getElementById("expl-text").innerText = item.expl;
    reviewBox.className = "review-box " + (item.isCorrect ? "correct-border" : "wrong-border");
    reviewBox.style.display = "block";
  } else {
    reviewBox.style.display = "none";
  }

  document.getElementById("prev-btn").disabled = (currentIndex === 0);
  document.getElementById("next-btn").disabled = (currentIndex === state.length - 1);
  updateNavGridAndStats();
}

function selectAnswer(optStr) {
  const item = state[currentIndex];
  item.answered = true;
  item.selectedStr = optStr;
  item.isCorrect = (optStr === item.correctStr);

  saveState();
  loadQuestion(currentIndex);
}

function toggleHint() {
  state[currentIndex].hintShown = true;
  saveState();
  document.getElementById("q-box").classList.add("show-markers");
}

function prevQuestion() {
  if (currentIndex > 0) loadQuestion(currentIndex - 1);
}

function nextQuestion() {
  if (currentIndex < state.length - 1) loadQuestion(currentIndex + 1);
}

function jumpToQuestion(idx) {
  loadQuestion(idx);
}

function confirmReset() {
  if (confirm("Ви дійсно хочете скинути всі відповіді, лічильники та заново перемішати варіанти?")) {
    localStorage.removeItem(STORAGE_KEY);
    loadInitialState();
    initNavGrid();
    loadQuestion(0);
  }
}

loadInitialState();
initNavGrid();
loadQuestion(0);
