<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер: Категорія 2 (47 питань - Граматика та колокації v2)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      max-width: 1100px;
      width: 100%;
      align-items: flex-start;
    }
    .sidebar {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      width: 260px;
      flex-shrink: 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .grid::-webkit-scrollbar {
      width: 5px;
    }
    .grid::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    .nav-btn {
      background: #334155;
      color: #cbd5e1;
      border: 2px solid transparent;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #475569; }
    .nav-btn.active { border-color: #38bdf8 !important; transform: scale(1.05); }
    .nav-btn.correct { background: #166534 !important; color: #ffffff !important; }
    .nav-btn.wrong { background: #991b1b !important; color: #ffffff !important; }

    .sidebar-stats {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #334155;
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-row { display: flex; justify-content: space-between; }
    .stat-val-green { color: #4ade80; font-weight: 600; }
    .stat-val-red { color: #f87171; font-weight: 600; }
    .stat-val-blue { color: #38bdf8; font-weight: 600; }

    .reset-btn {
      width: 100%;
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s;
    }
    .reset-btn:hover { background: #b91c1c; }

    .main-card {
      background: #1e293b;
      border-radius: 14px;
      flex-grow: 1;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
    .question-box {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #f1f5f9;
      background: #0f172a;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .marker {
      background: transparent;
      color: inherit;
      transition: all 0.3s;
    }
    .show-markers .marker {
      background: #facc15 !important;
      color: #0f172a !important;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }
    .btn {
      background: #334155;
      border: 2px solid transparent;
      color: #f8fafc;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover:not(:disabled) { background: #475569; }
    .btn.correct {
      background: #166534 !important;
      border-color: #22c55e !important;
      color: #ffffff;
      font-weight: 600;
    }
    .btn.wrong {
      background: #991b1b !important;
      border-color: #ef4444 !important;
      color: #ffffff;
    }
    .review-box {
      display: none;
      background: #091224;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      padding: 16px;
      margin-top: 15px;
      font-size: 14.5px;
      line-height: 1.5;
    }
    .review-box.correct-border { border-left-color: #22c55e; }
    .review-box.wrong-border { border-left-color: #ef4444; }
    .review-item { margin-bottom: 8px; }
    .review-item strong { color: #38bdf8; }

    .control-panel {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .nav-arrow-btn {
      flex: 1;
      background: #334155;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .nav-arrow-btn:hover:not(:disabled) { background: #475569; }
    .nav-arrow-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .hint-btn {
      background: #854d0e;
      color: #fef08a;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .hint-btn:hover { background: #a16207; }

    @media (max-width: 820px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .grid { grid-template-columns: repeat(8, 1fr); max-height: 220px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-title">Питання (1 - 47)</div>
    <div class="grid" id="nav-grid"></div>
    
    <div class="sidebar-stats">
      <div class="stat-row"><span>Правильно:</span> <span class="stat-val-green" id="stat-correct">0</span></div>
      <div class="stat-row"><span>Помилок:</span> <span class="stat-val-red" id="stat-wrong">0</span></div>
      <div class="stat-row"><span>Залишилось:</span> <span class="stat-val-blue" id="stat-left">47</span></div>
    </div>
    
    <button class="reset-btn" onclick="confirmReset()">Скинути весь прогрес</button>
  </div>

  <div class="main-card" id="app">
    <div class="header">
      <span id="q-counter">Питання 1 / 47</span>
      <span id="score-counter">Правильно: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div class="question-box" id="q-box"></div>
    <div class="options" id="opt-container"></div>
    
    <div class="review-box" id="review-box">
      <div class="review-item"><strong>Переклад:</strong> <span id="trans-text"></span></div>
      <div class="review-item"><strong>Ключовий маркер:</strong> <span id="clue-text"></span></div>
      <div class="review-item"><strong>Пояснення:</strong> <span id="expl-text"></span></div>
    </div>
    
    <div class="control-panel">
      <button class="nav-arrow-btn" id="prev-btn" onclick="prevQuestion()"><- Назад</button>
      <button class="hint-btn" id="hint-btn" onclick="toggleHint()">Підказка</button>
      <button class="nav-arrow-btn" id="next-btn" onclick="nextQuestion()">Наступне -></button>
    </div>
  </div>
</div>

const STORAGE_KEY = "category2_grammar_v2";

function shuffleArray(arr) {
  const newArr = [...arr];
  for (let i = newArr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
  }
  return newArr;
}

let state = [];
let currentIndex = 0;

function loadInitialState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      state = JSON.parse(saved);
      if (state.length === rawQuestions.length) return;
    } catch (e) {
      console.error(e);
    }
  }

  state = rawQuestions.map((item, idx) => ({
    id: idx,
    q: item.q,
    trans: item.trans,
    clue: item.clue,
    expl: item.expl,
    options: shuffleArray(item.options),
    correctStr: item.correct,
    answered: false,
    selectedStr: null,
    isCorrect: false,
    hintShown: false
  }));
  saveState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function initNavGrid() {
  const container = document.getElementById("nav-grid");
  container.innerHTML = "";
  state.forEach((_, idx) => {
    const btn = document.createElement("button");
    btn.className = "nav-btn";
    btn.id = `nav-btn-${idx}`;
    btn.innerText = idx + 1;
    btn.onclick = () => jumpToQuestion(idx);
    container.appendChild(btn);
  });
}

function updateNavGridAndStats() {
  let correctCount = 0;
  let wrongCount = 0;

  state.forEach((s, idx) => {
    const btn = document.getElementById(`nav-btn-${idx}`);
    if (!btn) return;
    btn.className = "nav-btn";
    if (idx === currentIndex) btn.classList.add("active");
    if (s.answered) {
      if (s.isCorrect) {
        btn.classList.add("correct");
        correctCount++;
      } else {
        btn.classList.add("wrong");
        wrongCount++;
      }
    }
  });

  const leftCount = state.length - (correctCount + wrongCount);
  document.getElementById("stat-correct").innerText = correctCount;
  document.getElementById("stat-wrong").innerText = wrongCount;
  document.getElementById("stat-left").innerText = leftCount;
  document.getElementById("score-counter").innerText = `Правильно: ${correctCount}`;
}

function loadQuestion(idx) {
  currentIndex = idx;
  const item = state[currentIndex];

  document.getElementById("q-counter").innerText = `Питання ${currentIndex + 1} / ${state.length}`;
  document.getElementById("progress").style.width = `${((currentIndex + 1) / state.length) * 100}%`;

  const qBox = document.getElementById("q-box");
  qBox.innerHTML = item.q;
  if (item.answered || item.hintShown) {
    qBox.classList.add("show-markers");
  } else {
    qBox.classList.remove("show-markers");
  }

  const container = document.getElementById("opt-container");
  container.innerHTML = "";

  item.options.forEach((optStr) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerText = optStr;

    if (item.answered) {
      btn.disabled = true;
      if (optStr === item.correctStr) btn.classList.add("correct");
      if (optStr === item.selectedStr && !item.isCorrect) btn.classList.add("wrong");
    } else {
      btn.onclick = () => selectAnswer(optStr);
    }
    container.appendChild(btn);
  });

  const reviewBox = document.getElementById("review-box");
  if (item.answered) {
    document.getElementById("trans-text").innerText = item.trans;
    document.getElementById("clue-text").innerText = item.clue;
    document.getElementById("expl-text").innerText = item.expl;
    reviewBox.className = "review-box " + (item.isCorrect ? "correct-border" : "wrong-border");
    reviewBox.style.display = "block";
  } else {
    reviewBox.style.display = "none";
  }

  document.getElementById("prev-btn").disabled = (currentIndex === 0);
  document.getElementById("next-btn").disabled = (currentIndex === state.length - 1);
  updateNavGridAndStats();
}

function selectAnswer(optStr) {
  const item = state[currentIndex];
  item.answered = true;
  item.selectedStr = optStr;
  item.isCorrect = (optStr === item.correctStr);

  saveState();
  loadQuestion(currentIndex);
}

function toggleHint() {
  state[currentIndex].hintShown = true;
  saveState();
  document.getElementById("q-box").classList.add("show-markers");
}

function prevQuestion() {
  if (currentIndex > 0) loadQuestion(currentIndex - 1);
}

function nextQuestion() {
  if (currentIndex < state.length - 1) loadQuestion(currentIndex + 1);
}

function jumpToQuestion(idx) {
  loadQuestion(idx);
}

function confirmReset() {
  if (confirm("Ви дійсно хочете скинути всі відповіді, лічильники та заново перемішати варіанти?")) {
    localStorage.removeItem(STORAGE_KEY);
    loadInitialState();
    initNavGrid();
    loadQuestion(0);
  }
}

loadInitialState();
initNavGrid();
loadQuestion(0);
